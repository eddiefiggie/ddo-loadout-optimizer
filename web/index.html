<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DDO Loadout Optimizer</title>
  <!-- ?v= is bumped on each UI deploy so browsers never serve a stale cached
       stylesheet/script after a release (GitHub Pages has no content hashing). -->
  <link rel="stylesheet" href="styles.css?v=33" />
</head>
<body>
  <header class="app-header">
    <div class="wrap">
      <h1>DDO Loadout Optimizer</h1>
      <p class="tagline">Your best-in-slot gear, proven by math.</p>
    </div>
  </header>

  <main id="app">
    <!-- The guided wizard (stepper + steps + results) is injected by wizard.js. -->
    <div id="wizard"></div>
  </main>

  <footer class="app-footer">
    <div class="wrap">
      <span id="dataset-info"></span>
      <span> · All item data sourced from the <a href="https://ddowiki.com" rel="noopener">DDO Wiki</a>.</span>
    </div>
  </footer>

  <script src="app.js?v=33"></script>
  <script src="model.js?v=33"></script>
  <script src="solver.js?v=33"></script>
  <script src="alternatives.js?v=33"></script>
  <script src="vendor/highs.js"></script>
  <script src="crafting-systems.js?v=33"></script>
  <script src="results.js?v=33"></script>
  <script src="import.js?v=33"></script>
  <script src="persist.js?v=33"></script>
  <script src="backup.js?v=33"></script>
  <script src="exporters.js?v=33"></script>
  <script src="browse.js?v=33"></script>
  <script src="wizard.js?v=33"></script>
</body>
</html>
