name: CI

# Runs the full gate on every pull request. Deploy (deploy.yml) runs the same gate
# again on push to main before publishing, so this does not replace it — it moves the
# signal to *before* the merge instead of after.
#
# Until this existed, `main` was the first place a red suite could surface, and main
# auto-deploys: a failure there blocks the live site rather than a branch.
#
# KEEP THE THREE GATE STEPS BELOW IN SYNC WITH deploy.yml's `build` job. They are
# duplicated deliberately rather than factored into a reusable workflow, because the
# deploy job needs the dataset it builds in its own workspace to upload the Pages
# artifact, and restructuring that path can only be validated by merging to main.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes the run in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build dataset and run both suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # #467 — the stamp check below compares against the PR's base commit, so
          # it needs real history. The default depth-1 checkout cannot see the base
          # and the check would exit 2 rather than quietly passing.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # web/data/items.json is generated and gitignored, so it must be built before
      # either suite: several Python tests assert against the file on disk.
      - name: Build dataset (parse -> expand -> verify)
        run: python3 build_dataset.py

      - name: Run Python tests
        run: python3 tests/run_tests.py

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      # One file per invocation. `node a.js b.js` runs ONLY the first and silently
      # skips the rest, which has hidden the golden solver check before.
      - name: Run JS tests (one file per invocation)
        run: |
          set -e
          for t in tests/*.test.js; do echo "== $t =="; node "$t"; done

      # #443 — the Utility perf gate, run BY PATH because it is deliberately
      # outside the tests/*.test.js glob (it is a wall-clock measurement, not a
      # unit test). Left to "run it by hand" it went unrun for four days while the
      # counting roster widened from 20 names to 25 and the ratio drifted from
      # 1.80x to 2.35x against a 2.00x budget. A guard nobody runs is not a guard:
      # docs/solutions/conventions/a-guard-outside-the-ci-glob-is-not-a-guard.md.
      #
      # #466 — the verdict is now two checks on PAIRED per-fixture measurements:
      # a cost-weighted total (sum(b)/sum(a) <= 1.75) and a worst-per-fixture
      # ratio over fixtures above a 200 ms measurement floor (<= 5.00). The old
      # across-fixture median was a coin flip near its budget AND blind to a
      # regression concentrated in one fixture; see the header of the gate for
      # the measurements behind both budgets. It exits 1 over either budget, so
      # this step blocks the build.
      - name: Run the Utility perf gate (outside the glob — invoked by path)
        run: node tests/perf_utility.js

      # #467 — the build stamp must move FORWARD, not merely agree with itself.
      # Outside tests/ and invoked BY PATH, same split as the perf gate above and
      # for the same reason: it needs git history, and a unit test that reads git
      # breaks in a shallow clone. tests/test_build_stamp.py keeps the tree-only
      # half (the three values agree, and ?v= IS the stamp).
      #
      # Catches a reverted stamp AND — the variant that actually fired on
      # 2026-08-24 — a stamp that did not move at all, which merges with NO
      # conflict when two branches independently claim the same next value.
      - name: Build stamp must advance (outside the suite — needs history)
        run: python3 scripts/check_stamp_advanced.py "${{ github.event.pull_request.base.sha }}"
