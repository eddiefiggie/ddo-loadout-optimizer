name: Deploy site to GitHub Pages

# main auto-deploys, so this workflow's `build` job is the last gate before the live
# site. ci.yml runs the SAME three gate steps on every pull request; keep the two in
# sync — if you add or change a gate here, mirror it there, or PRs stop catching what
# main catches.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build dataset (parse -> expand -> verify)
        run: python3 build_dataset.py
      - name: Run Python tests
        run: python3 tests/run_tests.py
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
      - name: Run JS tests (solver, model, browse, results, breakdown)
        run: |
          set -e
          for t in tests/*.test.js; do echo "== $t =="; node "$t"; done
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
