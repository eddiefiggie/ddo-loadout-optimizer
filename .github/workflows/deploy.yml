name: Deploy site to GitHub Pages

# main auto-deploys, so this workflow's `build` job is the last gate before the live
# site. ci.yml runs the SAME three gate steps on every pull request; keep the two in
# sync — if you add or change a gate here, mirror it there, or PRs stop catching what
# main catches.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build dataset (parse -> expand -> verify)
        run: python3 build_dataset.py
      - name: Run Python tests
        run: python3 tests/run_tests.py
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Run JS tests (solver, model, browse, results, breakdown)
        run: |
          set -e
          for t in tests/*.test.js; do echo "== $t =="; node "$t"; done
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
